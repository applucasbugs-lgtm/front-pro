*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:440px;width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:32px;text-align:center}
.logo{font-family:'Archivo Black',serif;font-size:20px;color:var(--gold-light);margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.spinner{width:38px;height:38px;border:3px solid var(--bg3);border-top-color:var(--gold);border-radius:50%;margin:8px auto 16px;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:15px;color:var(--white);margin-bottom:8px}
.detalhe{font-size:13px;color:var(--muted);line-height:1.6}
.ok-icon{width:54px;height:54px;border-radius:50%;background:var(--green-dim);border:1px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
.err-icon{width:54px;height:54px;border-radius:50%;background:var(--red-dim);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
.resumo{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-top:16px;text-align:left}
.resumo-linha{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.resumo-linha b{color:var(--gold-light)}
.btn{display:inline-block;margin-top:20px;padding:10px 20px;background:var(--gold-dim);border:0.5px solid var(--gold-border);border-radius:8px;color:var(--gold);font-size:13px;text-decoration:none;cursor:pointer}
.dim{font-size:11px;color:var(--muted);margin-top:14px}

<body>
<div class="card">
  <div class="logo">LUCAS BUGS | Hair Stylist</div>
  <div class="sub">Conexão AppBarber</div>
  <div id="conteudo">
    <div class="spinner"></div>
    <div class="status">Conectando…</div>
  </div>
</div>

<script src="api.js"></script>
<script>
var NOMES = {}; // preenchido com nomes das unidades, se possível

function lerHash(){
  var h = (location.hash || '').replace(/^#/, '');
  var p = {}; h.split('&').forEach(function(par){ var kv = par.split('='); if(kv[0]) p[kv[0]] = decodeURIComponent(kv[1]||''); });
  return p;
}

function render(html){ document.getElementById('conteudo').innerHTML = html; }

function mostrarErro(titulo, detalhe){
  render('<div class="err-icon">✕</div><div class="status">'+titulo+'</div><div class="detalhe">'+detalhe+'</div>'
    +'<div class="dim">Você pode fechar esta aba.</div>');
}

async function run(){
  var p = lerHash();
  if(!p.u || !p.c){
    mostrarErro('Link incompleto', 'Não recebi os dados da conexão. Tente clicar no atalho de novo, na aba do AppBarber.');
    return;
  }

  // 1) salva o cookie
  try{
    await req('POST', '/appbarber/sessao', { unidade_id: p.u, cookie: p.c });
  }catch(e){
    if((e.message||'').indexOf('401')>=0 || (e.status===401)){
      mostrarErro('Você não está logado no sistema', 'Abra o sistema em outra aba e faça login neste navegador. Depois clique no atalho de novo.');
    }else{
      mostrarErro('Não consegui salvar a conexão', e.message||'Tente de novo.');
    }
    return;
  }

  // 2) faz a primeira leitura
  render('<div class="spinner"></div><div class="status">Conectado! Lendo a agenda…</div>'
    +'<div class="detalhe">Isso pode levar alguns segundos.</div>');

  try{
    var r = await req('POST', '/appbarber/ler/'+p.u, {});
    if(r && r.ok===false){
      if(r.motivo==='SESSAO_EXPIRADA'){
        mostrarErro('O login do AppBarber não valeu', 'O cookie capturado não autenticou. Confirme que está logado no AppBarber e tente de novo.');
      }else{
        render('<div class="ok-icon">✓</div><div class="status">Conexão salva!</div>'
          +'<div class="detalhe">Mas a leitura deu erro:<br><br><b style="color:var(--gold)">'+(r.detalhe||'desconhecido')+'</b></div>'
          +'<div class="dim">Mande este erro para o suporte. Pode fechar a aba.</div>');
      }
      return;
    }
    var s = (r && r.resumo) || {};
    render('<div class="ok-icon">✓</div>'
      +'<div class="status">Conectado e agenda lida!</div>'
      +'<div class="resumo">'
      +'<div class="resumo-linha"><span>Agendamentos</span><b>'+(s.agendamentos||0)+'</b></div>'
      +'<div class="resumo-linha"><span>Bloqueios/folgas</span><b>'+(s.bloqueios||0)+'</b></div>'
      +'<div class="resumo-linha"><span>Novos clientes criados</span><b>'+(s.novos_clientes||0)+'</b></div>'
      +'<div class="resumo-linha"><span>Pendentes de vínculo</span><b>'+(s.pendentes_de_vinculo||0)+'</b></div>'
      +'</div>'
      +'<div class="dim">A conexão vale por 24h. Pode fechar esta aba.</div>');
  }catch(e){
    render('<div class="ok-icon">✓</div><div class="status">Conexão salva!</div>'
      +'<div class="detalhe">Mas não consegui ler a agenda agora: '+(e.message||'')+'</div>'
      +'<div class="dim">Pode fechar esta aba.</div>');
  }
}
run();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
